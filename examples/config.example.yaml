mailbox_addresses: [operator@example.com]
internal_domains: [example.com]
never_log: [investor@example.org]
# Case-insensitive shell globs against the full sender address; replaces defaults.
# [] disables address matching; false disables both address and header skips.
skip_automated_senders: true
automated_sender_patterns:
  - 'noreply*@*'
  - 'no[-_.]reply*@*'
  - 'donotreply*@*'
  - 'do[-_.]not[-_.]reply*@*'
  - 'notification@*'
  - 'notifications*@*'
  - 'mailer-daemon*@*'
  - 'drive-shares*@*'
  - '*docusign*@*'
  - '*echosign*@*'
  - '*@*docusign*'
  - '*@*echosign*'
private_label: Private - no CRM
# Avoid words found in email disclaimers (confidential, privileged): quoted replies carry them.
review_keywords: [term sheet, investment, board meeting, salary, strictly confidential]
# Paths are relative to this config file. Put your real config outside the repo.
state_path: ../.local/state.json
review_path: ../.local/review.jsonl
gmail_token_path: ../.local/gmail-token.json
hubspot_token_env: HUBSPOT_TOKEN
hubspot_owner_id: null
initial_since: '2026-10-01'
